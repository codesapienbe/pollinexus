version: '3.8'

services:
  # Pollinexus API Application
  pollinexus-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    image: pollinexus/api:latest
    container_name: pollinexus-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://pollinexus:${DB_PASSWORD}@postgres:5432/pollinexus
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DEBUG=False
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=pollinexus
      - POSTGRES_USER=pollinexus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - pollinexus_data:/app/data
      - pollinexus_uploads:/app/uploads
      - pollinexus_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # Celery Worker for Background Tasks
  pollinexus-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    image: pollinexus/worker:latest
    container_name: pollinexus-worker
    restart: unless-stopped
    command: celery -A pollinexus.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://pollinexus:${DB_PASSWORD}@postgres:5432/pollinexus
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DEBUG=False
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - pollinexus_data:/app/data
      - pollinexus_uploads:/app/uploads
      - pollinexus_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "celery", "-A", "pollinexus.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # Celery Beat for Scheduled Tasks
  pollinexus-beat:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    image: pollinexus/beat:latest
    container_name: pollinexus-beat
    restart: unless-stopped
    command: celery -A pollinexus.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pollinexus:${DB_PASSWORD}@postgres:5432/pollinexus
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DEBUG=False
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - pollinexus_data:/app/data
      - pollinexus_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "celery", "-A", "pollinexus.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pollinexus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pollinexus
      - POSTGRES_USER=pollinexus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollinexus -d pollinexus"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true

  # Redis for Caching and Message Broker
  redis:
    image: redis:7-alpine
    container_name: pollinexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pollinexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - pollinexus_logs:/var/log/nginx
    depends_on:
      - pollinexus-api
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: pollinexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Grafana for Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: pollinexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # Elasticsearch for Log Aggregation
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: pollinexus-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: pollinexus-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - pollinexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Filebeat for Log Shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: pollinexus-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - pollinexus_logs:/var/log/pollinexus:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - pollinexus-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Backup Service
  backup:
    image: postgres:15-alpine
    container_name: pollinexus-backup
    restart: "no"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=pollinexus
      - POSTGRES_USER=pollinexus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - BACKUP_SCHEDULE=0 2 * * *
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - ./backup:/backup
      - backup_data:/backup/data
    depends_on:
      - postgres
    networks:
      - pollinexus-network
    command: |
      sh -c '
      echo "Setting up backup service..."
      while true; do
        echo "Creating backup at $(date)"
        pg_dump -h postgres -U pollinexus -d pollinexus > /backup/data/backup_$(date +%Y%m%d_%H%M%S).sql
        echo "Backup completed"
        sleep 86400
      done
      '
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

volumes:
  pollinexus_data:
    driver: local
  pollinexus_uploads:
    driver: local
  pollinexus_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  backup_data:
    driver: local

networks:
  pollinexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 