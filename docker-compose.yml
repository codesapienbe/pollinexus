version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=duckdb:///pollinexus.db
      - LOG_LEVEL=INFO
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - redis
    networks:
      - pollinexus-network
    restart: unless-stopped
    command: uvicorn pollinexus.api.main:app --host 0.0.0.0 --port 8000

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=duckdb:///pollinexus.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - redis
      - api
    networks:
      - pollinexus-network
    restart: "no"
    command: python -m pollinexus.pipeline.pipeline train

  redis:
    image: redis:7-alpine
    networks:
      - pollinexus-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pollinexus-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - pollinexus-network
    restart: unless-stopped

networks:
  pollinexus-network:
    driver: bridge 